name: Build & Release Windows Installer

# Build the standalone Windows installer and publish it to the GitHub Releases
# page whenever a version tag (e.g. v2.3.0) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $version"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"

      - name: Build standalone application (PyInstaller)
        shell: pwsh
        run: pyinstaller packaging/hals_post.spec --noconfirm

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: ISCC "/DMyAppVersion=${{ steps.version.outputs.version }}" packaging\hals_installer.iss

      - name: Upload installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALS_Post_Setup_${{ steps.version.outputs.version }}
          path: installer/*.exe

      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HALS Post-Processing ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: installer/*.exe
